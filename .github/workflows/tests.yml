name: CI Tests & Coverage

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# INDISPENSABLE : Donne la permission au robot de modifier le code
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }} # Important pour pouvoir commiter sur la branche de la PR

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # genbadge est le remplacement moderne de coverage-badge, compatible Python 3.12+
          pip install genbadge[coverage]

      - name: Run Tests with Coverage
        run: |
          # Lance les tests et génère le rapport XML (requis par genbadge)
          pytest --cov=src/mindbug --cov-report=xml tests/

      - name: Generate Coverage Badge
        run: |
          # Génère le fichier coverage.svg depuis le rapport XML
          genbadge coverage -i coverage.xml -o coverage.svg

      - name: Commit Coverage Badge
        # Cette étape ne s'exécute que sur les Pull Requests (pour ne pas spammer main)
        if: github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update coverage badge [skip ci]"
          file_pattern: coverage.svg
